apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-api
  namespace: country-info
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: country-info-api
  template:
    metadata:
      labels:
        app: country-info-api
    spec:
      containers:
        - name: app
          image: your-registry/country-info-microservice:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: country-info-config}
            - secretRef: {name: country-info-secret}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: country-info-api
  namespace: country-info
spec:
  selector:
    app: country-info-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
