apiVersion: v1
kind: ConfigMap
metadata:
  name: country-info-config
  namespace: country-info
data:
    SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/country_info"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SERVER_PORT: "8080"
